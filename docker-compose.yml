services:
  mongo:
    image: mongo:latest
    container_name: movietracker-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: .
    container_name: movietracker-app
    ports:
      - "8080:8080"
    environment:
      - MONGO_DB_URI=mongodb://mongo:27017/movietracker
      - TMDB_READ_TOKEN=${TMDB_READ_TOKEN}
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo-data: